name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    uses: nocoo/base-ci/.github/workflows/quality.yml@633a5545fcfec91b688840650d4edf3e9cc1abbd # v2026.10
    with:
      package-manager: bun
      runtime-version: "1.4.2"
      node-version: "26.12.1"
      install-policy: blocked
      typecheck: true
      lint: true
      unit: true
      security: true
      typecheck-command: bun run typecheck
      lint-command: bun run lint
      test-command: bun run test:coverage
      lockfiles: bun.lock
      gitleaks-config: .gitleaks.toml
      coverage-path: coverage
      build: true
      build-command: bun run build
      l2: true
      l2-command: bun run test:l2
      l3: true
      l3-command: bun run test:l3
      l3-browser: chromium
  l1-rejection:
    name: L1 rejection probes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup JS and dependencies
        uses: nocoo/base-ci/.github/actions/setup-js@633a5545fcfec91b688840650d4edf3e9cc1abbd # v2026.10
        with:
          package-manager: bun
          runtime-version: "1.4.2"
          node-version: "26.12.1"
          install-policy: blocked

      - name: Run L1 rejection probes
        run: bun run gate:verify

  proof:
    needs: [quality, l1-rejection]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require aggregate source proof
        env:
          TESTED_SHA: ${{ needs.quality.outputs.tested-sha }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test -n "$TESTED_SHA"
          test "$TESTED_SHA" = "$EXPECTED_SHA"
          echo "Verified complete quality source: $TESTED_SHA"
