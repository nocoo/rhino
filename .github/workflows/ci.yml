# CI slot standard v1 (nocoo/base-ci docs/slots.md): impl S1, S2, S3, G1, G2, B1, L1, L2, L3, Z1 via quality.yml;
# na L1.5, P1 in slot-status. nocoo/base-ci v2026.12: top-level slot jobs, L2/L3 evidence uploads.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    uses: nocoo/base-ci/.github/workflows/quality.yml@1ea10ecab22b72512399485391603fe03a161016 # v2026.12
    with:
      package-manager: bun
      runtime-version: "1.4.2"
      node-version: "26.12.1"
      install-policy: blocked
      typecheck: true
      lint: true
      unit: true
      security: true
      typecheck-command: bun run typecheck
      lint-command: bun run lint
      test-command: bun run test:coverage
      lockfiles: bun.lock
      gitleaks-config: .gitleaks.toml
      coverage-path: coverage
      build: true
      build-command: bun run build
      workflow-lint: true
      workflow-lint-required-workflow: nocoo/base-ci/.github/workflows/deploy-worker.yml
      workflow-lint-yamllint: true
      l2: true
      l2-command: bun run test:l2
      l2-artifact-name: api-e2e-evidence
      l2-artifact-path: test-results/l2/
      l2-artifact-retention-days: 7
      l3: true
      l3-browsers: chromium
      l3-command: bun run test:l3
      l3-artifact-name: browser-evidence
      l3-artifact-path: test-results/l3/
      l3-artifact-retention-days: 14
      env-json: '{"WRANGLER_SEND_METRICS": "false", "CI": "true"}'
      slot-status: >-
        {"S1": {"status": "impl"},
        "S2": {"status": "impl"},
        "S3": {"status": "impl"},
        "G1": {"status": "impl"},
        "G2": {"status": "impl"},
        "B1": {"status": "impl"},
        "L1": {"status": "impl"},
        "L1.5": {"status": "na", "reason": "无 @cloudflare/vitest-pool-workers / miniflare 独立 Worker 运行时套件；绑定与 HTTP 由 L1 进程内 fetch 与 L2 覆盖"},
        "L2": {"status": "impl"},
        "L3": {"status": "impl"},
        "P1": {"status": "na", "reason": "package.json 为 private，不发布 npm 包"},
        "Z1": {"status": "impl"}}
  l1-rejection:
    name: L1 rejection probes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup JS and dependencies
        uses: nocoo/base-ci/.github/actions/setup-js@1ea10ecab22b72512399485391603fe03a161016 # v2026.12
        with:
          package-manager: bun
          runtime-version: "1.4.2"
          node-version: "26.12.1"
          install-policy: blocked

      - name: Run L1 rejection probes
        run: bun run gate:verify

  proof:
    needs: [quality, l1-rejection]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require aggregate source proof
        env:
          TESTED_SHA: ${{ needs.quality.outputs.tested-sha }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test -n "$TESTED_SHA"
          test "$TESTED_SHA" = "$EXPECTED_SHA"
          echo "Verified complete quality source: $TESTED_SHA"
